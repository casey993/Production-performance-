<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<link rel="manifest" href="manifest.webmanifest">
<title>Production Performance Board</title>
<style>
:root{--bg:#080808;--panel:#121212;--panel2:#191919;--orange:#ff6a00;--orange2:#ff9a3d;--text:#f7f7f7;--muted:#a7a7a7;--line:#303030;--good:#36c275;--bad:#ff5252;--warn:#ffc247}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(8,8,8,.95);border-bottom:1px solid #282828;padding:16px 18px;backdrop-filter:blur(12px)}
.head{max-width:1500px;margin:auto;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(21px,3vw,34px);margin:0;letter-spacing:.02em}.accent{color:var(--orange)}
.meta{display:flex;gap:8px;flex-wrap:wrap}.meta input{width:auto;min-width:120px}
main{max-width:1500px;margin:auto;padding:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
button,.btn{border:1px solid #3b3b3b;background:#1b1b1b;color:#fff;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}
button.primary{background:var(--orange);border-color:var(--orange);color:#111}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{grid-column:span 6;background:linear-gradient(180deg,#151515,#101010);border:1px solid #292929;border-radius:15px;overflow:hidden;box-shadow:0 8px 30px #0005}
.card.wide{grid-column:span 12}.card.third{grid-column:span 4}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #292929}
.cardhead h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.08em}.num{display:inline-grid;place-items:center;background:var(--orange);color:#111;width:25px;height:25px;border-radius:50%;margin-right:7px}
.body{padding:14px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.kpi{background:#1b1b1b;border:1px solid #303030;border-radius:10px;padding:9px}
.kpi small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.kpi b{font-size:18px}.good{color:var(--good)}.bad{color:var(--bad)}
label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}input,select,textarea{width:100%;background:#0c0c0c;border:1px solid #363636;border-radius:8px;color:#fff;padding:9px;font:inherit}
.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.chart{height:190px;background:#0b0b0b;border:1px solid #252525;border-radius:10px;padding:8px}
canvas{width:100%;height:100%}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:500px}th,td{border:1px solid #303030;padding:7px;text-align:center;font-size:12px}th{background:#1c1c1c;color:#ddd}
td input,td select{padding:5px}.matrix td input{min-width:65px}.skilldot{width:26px!important;padding:4px!important;text-align:center}
.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.suggestion{background:#1a1a1a;border:1px solid #333;border-radius:9px;padding:9px}.suggestion textarea{min-height:72px}
.kaizen{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{border:1px dashed #555;border-radius:10px;min-height:130px;padding:10px;background:#0c0c0c}.photo input{margin-top:8px}.photo img{width:100%;max-height:190px;object-fit:cover;border-radius:7px;display:none}
footer{color:#777;text-align:center;padding:25px;font-size:11px}.goalpill{font-size:11px;border:1px solid #4a4a4a;border-radius:999px;padding:4px 8px;color:#ccc}
@media(max-width:900px){.card,.card.third{grid-column:span 12}.kpis,.inputs{grid-template-columns:repeat(2,1fr)}.suggestions{grid-template-columns:1fr}.kaizen{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="head"><h1><span class="accent">PRODUCTION</span> PERFORMANCE BOARD</h1><div class="meta">
<div><label>Date</label><input id="boardDate" type="date"></div><div><label>Shift</label><input id="shift" value="A"></div>
</div></div></header>
<main>
<div class="toolbar"><button class="primary" onclick="newPeriod()">+ New Period</button><button onclick="exportData()">Backup Data</button><label class="btn">Restore Data<input id="restore" type="file" accept=".json" hidden></label><button onclick="window.print()">Print Board</button></div>
<div class="grid" id="board"></div>
</main><footer>Production Performance Board • Data auto-saves on this device</footer>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='ppb-orange-v2';
const defaults={boardDate:new Date().toISOString().slice(0,10),shift:'A',
 metrics:{
 throughput:{goal:400,unit:'units',values:[350,390,310,455,430,410,480,420]},
 oee:{goal:85,unit:'%',values:[72,76,84,88,83,86,81,82]},
 breakdown:{goal:30,unit:'min max',values:[40,28,12,16,8,5,9,45]},
 yield:{goal:98,unit:'%',values:[95,96,97,98,98.5,97.7,97.2]},
 otd:{goal:95,unit:'%',values:[92,94,95,96,94,97,95]},
 safety:{goal:0,unit:'incidents',values:[0,0,0,0,0,0,0,0]}
 },
 cost:[['Labour','G','R','C','B'],['Material','G','R','A','B'],['Energy','G','R','A','C']],
 skills:[['Member 1','3','3','3','2','2'],['Member 2','3','3','3','3','2'],['Member 3','3','3','2','2','1'],['Member 4','3','3','3','3','1']],
 suggestions:['Replace jig','Tooling issue','Ergonomics'],
 kaizen:{beforeText:'',afterText:'',beforeImg:'',afterImg:''}, history:[]
};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaults);
function save(){data.boardDate=$('#boardDate').value;data.shift=$('#shift').value;localStorage.setItem(KEY,JSON.stringify(data))}
function avg(a){return a.length?a.reduce((x,y)=>x+(+y||0),0)/a.length:0}
function status(key,v,g){if(key==='breakdown'||key==='safety')return v<=g;return v>=g}
function chart(canvas,vals,goal,type='line'){
 const c=canvas,ctx=c.getContext('2d'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.scale(d,d);
 const w=r.width,h=r.height,p=28,all=[...vals,+goal||0],max=Math.max(...all,1)*1.12,min=0;
 ctx.strokeStyle='#2c2c2c';ctx.lineWidth=1;ctx.font='10px system-ui';ctx.fillStyle='#8f8f8f';
 for(let i=0;i<5;i++){let y=p+(h-2*p)*i/4;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/4)),2,y+3)}
 let gx=p+(h-2*p)*(1-goal/max);ctx.setLineDash([5,4]);ctx.strokeStyle='#ff6a00';ctx.beginPath();ctx.moveTo(p,gx);ctx.lineTo(w-p,gx);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff8a2b';ctx.fillText('Goal '+goal,p+3,Math.max(10,gx-4));
 const step=(w-2*p)/Math.max(vals.length-1,1);
 if(type==='bar'){vals.forEach((v,i)=>{let bh=(h-2*p)*(v/max),x=p+i*((w-2*p)/vals.length)+5,bw=(w-2*p)/vals.length-10;ctx.fillStyle=status(canvas.dataset.key,+v,+goal)?'#ff8a2b':'#5a5a5a';ctx.fillRect(x,h-p-bh,Math.max(3,bw),bh)})}
 else{ctx.strokeStyle='#f3f3f3';ctx.lineWidth=2;ctx.beginPath();vals.forEach((v,i)=>{let x=p+i*step,y=h-p-(h-2*p)*(v/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();vals.forEach((v,i)=>{let x=p+i*step,y=h-p-(h-2*p)*(v/max);ctx.fillStyle=status(canvas.dataset.key,+v,+goal)?'#ff6a00':'#777';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()})}
}
function metricCard(n,key,title,type='line'){
 let m=data.metrics[key],current=+m.values.at(-1)||0,a=avg(m.values),ok=status(key,current,+m.goal);
 return `<section class="card"><div class="cardhead"><h2><span class="num">${n}</span>${title}</h2><span class="goalpill">Editable goal</span></div><div class="body">
 <div class="kpis"><div class="kpi"><small>Current</small><b class="${ok?'good':'bad'}">${current}${key==='oee'||key==='yield'||key==='otd'?'%':''}</b></div><div class="kpi"><small>Goal</small><b>${m.goal}</b></div><div class="kpi"><small>Average</small><b>${a.toFixed(1)}</b></div><div class="kpi"><small>Status</small><b class="${ok?'good':'bad'}">${ok?'ON TARGET':'ACTION'}</b></div></div>
 <div class="inputs"><div><label>Goal</label><input type="number" step="any" data-goal="${key}" value="${m.goal}"></div>${m.values.map((v,i)=>`<div><label>P${i+1}</label><input type="number" step="any" data-metric="${key}" data-i="${i}" value="${v}"></div>`).join('')}</div>
 <div class="chart"><canvas data-chart="${key}" data-key="${key}" data-type="${type}"></canvas></div></div></section>`
}
function render(){
 $('#boardDate').value=data.boardDate;$('#shift').value=data.shift;
 $('#board').innerHTML=
 metricCard(1,'throughput','Throughput','bar')+
 metricCard(2,'oee','OEE Trend')+
 metricCard(3,'breakdown','Breakdown Trend','bar')+
 metricCard(4,'yield','Yield Trend')+
 `<section class="card"><div class="cardhead"><h2><span class="num">5</span>Manufacturing Cost Matrix</h2></div><div class="body tablewrap"><table class="matrix"><tr><th>Cost</th><th>Labour Variance</th><th>Material Variance</th><th>Energy Variance</th><th>Budget</th></tr>${data.cost.map((r,ri)=>`<tr>${r.map((x,ci)=>ci?`<td><input data-cost="${ri},${ci}" value="${x}"></td>`:`<th>${x}</th>`).join('')}</tr>`).join('')}</table></div></section>`+
 metricCard(6,'otd','OTD Trend')+
 metricCard(7,'safety','Safety Trends','bar')+
 `<section class="card"><div class="cardhead"><h2><span class="num">8</span>Skill Matrix</h2></div><div class="body tablewrap"><table><tr><th>Team Member</th><th>Skill 1</th><th>Skill 2</th><th>Skill 3</th><th>Skill 4</th><th>Skill 5</th></tr>${data.skills.map((r,ri)=>`<tr>${r.map((x,ci)=>`<td><input class="${ci?'skilldot':''}" data-skill="${ri},${ci}" value="${x}"></td>`).join('')}</tr>`).join('')}</table><p style="color:#888;font-size:11px">Skill scale: 0–3. Edit names and levels directly.</p></div></section>`+
 `<section class="card"><div class="cardhead"><h2><span class="num">9</span>Suggestion Details</h2></div><div class="body"><div class="suggestions">${data.suggestions.map((x,i)=>`<div class="suggestion"><label>Suggestion ${i+1}</label><textarea data-suggestion="${i}">${x}</textarea><select><option>Open</option><option>In Progress</option><option>Complete</option></select></div>`).join('')}</div></div></section>`+
 `<section class="card wide"><div class="cardhead"><h2><span class="num">10</span>Kaizen Before & After</h2></div><div class="body kaizen">${['before','after'].map(k=>`<div class="photo"><b>${k.toUpperCase()}</b><img id="${k}Img" ${data.kaizen[k+'Img']?`src="${data.kaizen[k+'Img']}" style="display:block"`:''}><input type="file" accept="image/*" data-photo="${k}"><textarea data-kaizen="${k}Text" placeholder="${k} notes...">${data.kaizen[k+'Text']||''}</textarea></div>`).join('')}</div></section>`;
 bind(); drawAll();
}
function bind(){
 $$('[data-goal]').forEach(e=>e.oninput=()=>{data.metrics[e.dataset.goal].goal=+e.value;save();render()});
 $$('[data-metric]').forEach(e=>e.onchange=()=>{data.metrics[e.dataset.metric].values[+e.dataset.i]=+e.value;save();render()});
 $$('[data-cost]').forEach(e=>e.onchange=()=>{let[a,b]=e.dataset.cost.split(',');data.cost[a][b]=e.value;save()});
 $$('[data-skill]').forEach(e=>e.onchange=()=>{let[a,b]=e.dataset.skill.split(',');data.skills[a][b]=e.value;save()});
 $$('[data-suggestion]').forEach(e=>e.onchange=()=>{data.suggestions[+e.dataset.suggestion]=e.value;save()});
 $$('[data-kaizen]').forEach(e=>e.onchange=()=>{data.kaizen[e.dataset.kaizen]=e.value;save()});
 $$('[data-photo]').forEach(e=>e.onchange=ev=>{let f=ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{data.kaizen[e.dataset.photo+'Img']=rd.result;save();render()};rd.readAsDataURL(f)});
}
function drawAll(){$$('[data-chart]').forEach(c=>{let k=c.dataset.chart,m=data.metrics[k];chart(c,m.values,+m.goal,c.dataset.type)})}
function newPeriod(){data.history.push(JSON.parse(JSON.stringify({date:data.boardDate,shift:data.shift,metrics:data.metrics})));Object.values(data.metrics).forEach(m=>m.values=m.values.map(()=>0));data.boardDate=new Date().toISOString().slice(0,10);save();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='production-performance-board-backup.json';a.click()}
$('#restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();render()}catch{alert('Invalid backup file')}};r.readAsText(f)}
$('#boardDate').onchange=save;$('#shift').onchange=save;window.addEventListener('resize',drawAll);
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
